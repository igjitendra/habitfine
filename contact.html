<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Contact — HabitFine</title>
    <link rel="icon" type="image/png" href="images/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #06080D;
            --bg-card: rgba(16, 21, 32, 0.72);
            --brand-red: #EF3B36;
            --brand-red-light: #FF5D58;
            --brand-glow: rgba(239, 59, 54, 0.35);
            --text-pure: #FFFFFF;
            --text-main: #F1F5F9;
            --text-muted: #8E9BAE;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-void); color: var(--text-main); font-family: var(--font-main); line-height: 1.7; padding: 40px 20px; }
        .container { max-width: 680px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 28px; padding: 44px 36px; backdrop-filter: blur(16px); }
        .brand-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 20px; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-size: 20px; font-weight: 800; }
        .brand img { width: 34px; height: 34px; border-radius: 8px; }
        .brand span span { color: var(--brand-red-light); }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
        .back-btn:hover { color: #fff; }
        h1 { font-size: 30px; font-weight: 800; color: var(--text-pure); margin-bottom: 6px; }
        p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        input, select, textarea { width: 100%; background: #080B12; border: 1px solid var(--border-subtle); border-radius: 12px; padding: 14px 16px; color: #fff; font-family: var(--font-main); font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--brand-red); }
        .btn-submit { width: 100%; background: var(--brand-red); color: #fff; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 4px 20px var(--brand-glow); margin-top: 10px; transition: transform 0.2s; }
        .btn-submit:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <a href="index.html" class="brand">
                <img src="images/icon.png" alt="HabitFine Logo" onerror="this.src='images/splash-icon.png'">
                <span>Habit<span>Fine</span></span>
            </a>
            <a href="index.html" class="back-btn">← Back to Home</a>
        </div>

        <h1>Contact & Support</h1>
        <p>Have a suggestion, found a bug, or need help with HabitFine Plus? Drop us a message.</p>

        <form onsubmit="event.preventDefault(); alert('Thank you! Your feedback has been sent to our developer team.');">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select>
                    <option>Feature Request / Suggestion</option>
                    <option>Bug Report</option>
                    <option>Promo Code / Plus Subscription</option>
                    <option>Other Question</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="4" placeholder="Describe your inquiry..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message ➔</button>
        </form>
    </div>
</body>
</html>
